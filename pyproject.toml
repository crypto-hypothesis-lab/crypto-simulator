[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-simulator"
version = "0.1.0"
description = "Exchange-neutral crypto market data adapters and reproducible backtests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
realtime = ["websockets>=13"]
analysis = ["duckdb>=1.3,<2", "pytz>=2024.1"]
exchanges = ["ccxt>=4,<5"]
dev = ["pytest>=8"]

[project.scripts]
crypto-simulator = "crypto_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
