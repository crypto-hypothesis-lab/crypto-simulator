name: Forward test Binance BTC/USDT

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback in days, including warm-up"
        required: false
        default: "365"
        type: string
      holdout_days:
        description: "Latest holdout window in days"
        required: false
        default: "60"
        type: string
      fast:
        description: "Frozen execution SMA fast window"
        required: false
        default: "20"
        type: string
      slow:
        description: "Frozen execution SMA slow window"
        required: false
        default: "50"
        type: string
      trend_fast:
        description: "Frozen 4-hour trend SMA fast window"
        required: false
        default: "5"
        type: string
      trend_slow:
        description: "Frozen 4-hour trend SMA slow window"
        required: false
        default: "20"
        type: string
      regime_fast:
        description: "Frozen 1-day regime SMA fast window"
        required: false
        default: "5"
        type: string
      regime_slow:
        description: "Frozen 1-day regime SMA slow window"
        required: false
        default: "20"
        type: string
      spread_bps:
        description: "Round-trip spread assumption in basis points"
        required: false
        default: "10"
        type: string
      market_impact_bps:
        description: "One-way market-impact assumption in basis points"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-forward-test
  cancel-in-progress: true

jobs:
  forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch public history
        run: >-
          python -m crypto_simulator fetch
          --exchange binance
          --symbol BTCUSDT
          --interval 1h
          --days "${{ inputs.days }}"
          --output /tmp/binance_btcusdt_1h.csv
      - name: Run frozen forward test
        run: >-
          python -m crypto_simulator forward-test
          --input /tmp/binance_btcusdt_1h.csv
          --interval 1h
          --holdout-days "${{ inputs.holdout_days }}"
          --fast "${{ inputs.fast }}"
          --slow "${{ inputs.slow }}"
          --trend-fast "${{ inputs.trend_fast }}"
          --trend-slow "${{ inputs.trend_slow }}"
          --regime-fast "${{ inputs.regime_fast }}"
          --regime-slow "${{ inputs.regime_slow }}"
          --spread-bps "${{ inputs.spread_bps }}"
          --market-impact-bps "${{ inputs.market_impact_bps }}"
          --output state/binance-btcusdt-forward-test.json
      - name: Upload forward-test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binance-btcusdt-forward-test-${{ github.run_id }}
          path: state/binance-btcusdt-forward-test.json
          retention-days: 30
