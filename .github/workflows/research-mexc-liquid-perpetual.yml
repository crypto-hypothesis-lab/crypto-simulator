name: Research MEXC liquid crypto perpetuals

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback in days"
        required: false
        default: "365"
        type: string
      max_symbols:
        description: "Maximum current liquid crypto perpetuals, including BTC"
        required: false
        default: "12"
        type: string
      min_quote_turnover_24h:
        description: "Minimum current 24h quote turnover in USDT"
        required: false
        default: "10000000"
        type: string
      min_median_daily_quote_turnover:
        description: "Minimum historical 7-day median daily quote turnover in USDT"
        required: false
        default: "5000000"
        type: string
      max_spread_bps:
        description: "Maximum current bid/ask spread in basis points"
        required: false
        default: "25"
        type: string
      min_history_bars:
        description: "Minimum 1-hour bars required after the history fetch"
        required: false
        default: "6000"
        type: string
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: read

concurrency:
  group: crypto-mexc-liquid-perpetual-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Select current liquid crypto universe
        run: |
          mkdir -p /tmp/mexc
          python -m crypto_simulator mexc-liquid-select \
            --max-symbols "${{ inputs.max_symbols || '12' }}" \
            --min-quote-turnover-24h "${{ inputs.min_quote_turnover_24h || '10000000' }}" \
            --max-spread-bps "${{ inputs.max_spread_bps || '25' }}" \
            --benchmark-symbol BTC_USDT \
            --output state/mexc-liquid-universe.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("state/mexc-liquid-universe.json").read_text(encoding="utf-8"))
          symbols = [item["symbol"] for item in manifest["symbols"]]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("MEXC_SYMBOLS=" + " ".join(symbols) + "\n")
          print("selected_symbols=" + ",".join(symbols))
          PY
      - name: Fetch selected 1-hour history
        run: |
          set +e
          failures=0
          for symbol in $MEXC_SYMBOLS; do
            python -m crypto_simulator fetch \
              --exchange mexc \
              --symbol "$symbol" \
              --interval 1h \
              --days "${{ inputs.days || '365' }}" \
              --output "/tmp/mexc/${symbol}.csv"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "$symbol" >> /tmp/mexc/history-failures.txt
              failures=$((failures + 1))
            fi
          done
          echo "history_fetch_failures=$failures"
      - name: Build history input list
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("state/mexc-liquid-universe.json").read_text(encoding="utf-8"))
          inputs = []
          symbols = []
          for item in manifest["symbols"]:
              symbol = item["symbol"]
              path = Path("/tmp/mexc") / f"{symbol}.csv"
              try:
                  with path.open(newline="", encoding="utf-8") as file:
                      bars = sum(1 for _ in csv.DictReader(file))
              except FileNotFoundError:
                  bars = 0
              if bars:
                  inputs.extend(["--input", f"{symbol}={path}"])
                  symbols.append(symbol)
          if "BTC_USDT" not in symbols:
              raise RuntimeError("BTC history was not available")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("MEXC_HISTORY_SYMBOLS=" + " ".join(symbols) + "\n")
              env.write("MEXC_HISTORY_INPUT_ARGS=" + " ".join(inputs) + "\n")
          print("history_symbols=" + ",".join(symbols))
          PY
      - name: Fetch Funding history
        run: |
          set +e
          for symbol in $MEXC_HISTORY_SYMBOLS; do
            python -m crypto_simulator fetch-funding \
              --exchange mexc \
              --symbol "$symbol" \
              --days "${{ inputs.days || '365' }}" \
              --output "/tmp/mexc/${symbol}-funding.json"
          done
      - name: Audit historical liquidity and volume regimes
        run: >-
          python -m crypto_simulator mexc-liquidity-audit
          --selection state/mexc-liquid-universe.json
          $MEXC_HISTORY_INPUT_ARGS
          --interval 1hour
          --max-symbols "${{ inputs.max_symbols || '12' }}"
          --min-quote-turnover-24h "${{ inputs.min_quote_turnover_24h || '10000000' }}"
          --min-median-daily-quote-turnover "${{ inputs.min_median_daily_quote_turnover || '5000000' }}"
          --max-spread-bps "${{ inputs.max_spread_bps || '25' }}"
          --min-history-bars "${{ inputs.min_history_bars || '6000' }}"
          --output state/mexc-liquid-universe-audited.json
      - name: Build eligible research inputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("state/mexc-liquid-universe-audited.json").read_text(encoding="utf-8"))
          inputs = []
          funding = []
          leverage_map = {}
          for symbol in manifest["eligible_symbols"]:
              inputs.extend(["--input", f"{symbol}=/tmp/mexc/{symbol}.csv"])
              funding_path = Path("/tmp/mexc") / f"{symbol}-funding.json"
              if funding_path.exists():
                  funding.extend(["--funding", str(funding_path)])
              item = next((value for value in manifest["symbols"] if value["symbol"] == symbol), {})
              size_multiplier = float((item.get("history") or {}).get("size_multiplier", 1.0))
              leverage_map[symbol] = str(min(5.0, 5.0 * size_multiplier))
          Path("state/mexc-max-leverage-map.json").write_text(json.dumps(leverage_map, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("MEXC_ELIGIBLE_INPUT_ARGS=" + " ".join(inputs) + "\n")
              env.write("MEXC_ELIGIBLE_FUNDING_ARGS=" + " ".join(funding) + "\n")
              env.write("MEXC_MAX_LEVERAGE_MAP=state/mexc-max-leverage-map.json\n")
          print("eligible_symbols=" + ",".join(manifest["eligible_symbols"]))
          print("rejected_symbols=" + ",".join(manifest["rejected_symbols"]))
          PY
      - name: Run event-strategy research
        run: >-
          python -m crypto_simulator limit-bracket-research
          --market perpetual
          --profile mexc-event
          --interval 1hour
          $MEXC_ELIGIBLE_INPUT_ARGS
          $MEXC_ELIGIBLE_FUNDING_ARGS
          --benchmark-symbol BTC_USDT
          --train-days 180
          --test-days 60
          --step-days 60
          --fee-bps 5
          --slippage-bps 5
          --spread-bps 10
          --market-impact-bps 5
          --max-gross-leverage 5
          --max-leverage-map "$MEXC_MAX_LEVERAGE_MAP"
          --output state/mexc-liquid-event-research.json
      - name: Build research decision report
        run: |
          python -m crypto_simulator research-report \
            --input state/mexc-liquid-event-research.json \
            --exchange mexc \
            --report-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output state/mexc-research-report.json
      - name: Prepare Paper profile when research passes
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("state/mexc-research-report.json").read_text(encoding="utf-8"))
          profile = report.get("strategy", {}).get("profile", "") if report.get("decision") == "paper_start" else ""
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("PAPER_PROFILE=" + profile + "\n")
          print("paper_profile=" + (profile or "none"))
          PY
      - name: Generate latest Paper bracket candidate
        if: ${{ env.PAPER_PROFILE != '' }}
        run: >-
          python -m crypto_simulator limit-bracket-signal
          --market perpetual
          --profile "$PAPER_PROFILE"
          --interval 1hour
          $MEXC_ELIGIBLE_INPUT_ARGS
          $MEXC_ELIGIBLE_FUNDING_ARGS
          --benchmark-symbol BTC_USDT
          --max-gross-leverage 5
          --max-leverage-map "$MEXC_MAX_LEVERAGE_MAP"
          --output state/mexc-latest-bracket-signal.json
      - name: Report research result to Discord
        if: ${{ secrets.NOTIFY_ADMIN_TOKEN != '' }}
        env:
          NOTIFY_ADMIN_TOKEN: ${{ secrets.NOTIFY_ADMIN_TOKEN }}
          NOTIFY_URL: https://crypto-hypothesis-lab-notifier.bej1550.workers.dev
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          "$NOTIFY_URL/admin/research-report"
          --header "Authorization: Bearer $NOTIFY_ADMIN_TOKEN"
          --header "Content-Type: application/json"
          --data-binary @state/mexc-research-report.json
      - name: Report Paper candidate to Discord and private Paper bridge
        if: ${{ env.PAPER_PROFILE != '' && secrets.NOTIFY_ADMIN_TOKEN != '' }}
        env:
          NOTIFY_ADMIN_TOKEN: ${{ secrets.NOTIFY_ADMIN_TOKEN }}
          NOTIFY_URL: https://crypto-hypothesis-lab-notifier.bej1550.workers.dev
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          "$NOTIFY_URL/admin/bracket-ingest"
          --header "Authorization: Bearer $NOTIFY_ADMIN_TOKEN"
          --header "Content-Type: application/json"
          --data-binary @state/mexc-latest-bracket-signal.json
      - name: Warn when Discord reporting is not configured
        if: ${{ secrets.NOTIFY_ADMIN_TOKEN == '' }}
        run: echo "NOTIFY_ADMIN_TOKEN is not configured; research ran but Discord/Paper bridge reporting was skipped."
      - name: Upload liquid-universe research report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mexc-liquid-perpetual-research-${{ github.run_id }}
          path: |
            state/mexc-liquid-universe.json
            state/mexc-liquid-universe-audited.json
            state/mexc-max-leverage-map.json
            state/mexc-liquid-event-research.json
            state/mexc-research-report.json
            state/mexc-latest-bracket-signal.json
          if-no-files-found: ignore
          retention-days: 30
