name: Generate parallel event Paper snapshots

on:
  workflow_dispatch:
  schedule:
    # Finish before the existing Sakura bridge window at minute 20.
    - cron: "10 * * * *"

permissions:
  contents: write

concurrency:
  group: crypto-parallel-paper-event
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch public candles and generate canonical Paper decisions
        run: python scripts/generate_parallel_paper_snapshots.py
      - name: Commit current decisions and compact fill windows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/paper-event
          git diff --cached --quiet || git commit -m "data: update parallel event Paper snapshots"
          git push
