name: Derivatives regime Shadow snapshot

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated perpetual symbols"
        required: false
        default: "BTC,ETH"
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-derivatives-shadow
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Collect public Shadow snapshot
        env:
          SHADOW_SYMBOLS: ${{ inputs.symbols }}
        run: |
          args=()
          IFS=',' read -ra symbols <<< "$SHADOW_SYMBOLS"
          for symbol in "${symbols[@]}"; do
            args+=(--symbol "$symbol")
          done
          python -m crypto_simulator derivatives-shadow "${args[@]}" --output state/derivatives-shadow.json
      - name: Upload Shadow report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: derivatives-shadow-${{ github.run_id }}
          path: state/derivatives-shadow.json
          retention-days: 30
