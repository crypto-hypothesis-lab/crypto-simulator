name: Research HyperLiquid perpetual portfolio

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback in days, including funding history"
        required: false
        default: "365"
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-hyperliquid-perpetual-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch fixed perpetual universe
        run: |
          mkdir -p /tmp/hyperliquid
          for symbol in BTC ETH DOGE; do
            python -m crypto_simulator fetch \
              --exchange hyperliquid \
              --symbol "$symbol" \
              --interval 1d \
              --days "${{ inputs.days }}" \
              --output "/tmp/hyperliquid/${symbol}.csv"
            python -m crypto_simulator fetch-funding \
              --symbol "$symbol" \
              --days "${{ inputs.days }}" \
              --output "/tmp/hyperliquid/${symbol}-funding.json"
          done
      - name: Run perpetual research with funding costs
        run: >-
          python -m crypto_simulator portfolio-research
          --market perpetual
          --input BTC=/tmp/hyperliquid/BTC.csv
          --input ETH=/tmp/hyperliquid/ETH.csv
          --input DOGE=/tmp/hyperliquid/DOGE.csv
          --funding /tmp/hyperliquid/BTC-funding.json
          --funding /tmp/hyperliquid/ETH-funding.json
          --funding /tmp/hyperliquid/DOGE-funding.json
          --benchmark-symbol BTC
          --interval 1day
          --train-days 180
          --test-days 60
          --step-days 60
          --fee-bps 5
          --slippage-bps 5
          --spread-bps 10
          --market-impact-bps 5
          --max-gross-leverage 1.5
          --output state/hyperliquid-perpetual-portfolio-research.json
      - name: Upload perpetual research report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hyperliquid-perpetual-portfolio-research-${{ github.run_id }}
          path: state/hyperliquid-perpetual-portfolio-research.json
          retention-days: 30
