name: Research Binance BTC/USDT

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical lookback in days"
        required: false
        default: "365"
        type: string

permissions:
  contents: read

concurrency:
  group: crypto-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch public history
        run: >-
          python -m crypto_simulator fetch
          --exchange binance
          --symbol BTCUSDT
          --interval 1h
          --days "${{ inputs.days }}"
          --output /tmp/binance_btcusdt_1h.csv
      - name: Run fixed-candidate walk-forward research
        run: >-
          python -m crypto_simulator research
          --input /tmp/binance_btcusdt_1h.csv
          --interval 1h
          --train-days 180
          --test-days 60
          --step-days 60
          --output state/binance-btcusdt-research.json
      - name: Upload research report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binance-btcusdt-research-${{ github.run_id }}
          path: state/binance-btcusdt-research.json
          retention-days: 30
