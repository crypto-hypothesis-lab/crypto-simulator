name: Collect bitbank BTC/JPY candles

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch and merge latest closed-window data
        run: python -m crypto_simulator collect --exchange bitbank --symbol btc_jpy --interval 1hour --hours 72 --output data/bitbank_btc_jpy_1hour.csv
      - name: Commit dataset when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/bitbank_btc_jpy_1hour.csv
          git diff --cached --quiet || git commit -m "data: update bitbank BTC/JPY 1h candles"
          git push
