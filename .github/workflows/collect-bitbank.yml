name: Collect bitbank BTC/JPY candles

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install simulator
        run: python -m pip install .
      - name: Fetch and merge latest closed-window data
        run: python -m crypto_simulator collect --exchange bitbank --symbol btc_jpy --interval 1hour --hours 72 --output data/bitbank_btc_jpy_1hour.csv
      - name: Generate latest paper bracket snapshot
        run: |
          python -m crypto_simulator limit-bracket-signal \
            --market spot \
            --interval 1hour \
            --benchmark-symbol BTC \
            --input BTC=data/bitbank_btc_jpy_1hour.csv \
            --output data/bitbank_btc_jpy_bracket_signal.json
      - name: Commit dataset and snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -- data/bitbank_btc_jpy_1hour.csv data/bitbank_btc_jpy_bracket_signal.json
          git diff --cached --quiet || git commit -m "data: update bitbank BTC/JPY research snapshot"
          git push
